<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produktų Valdymas</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>

<body>
    <button class="dark-mode-toggle" id="dark-mode-toggle">🌙</button>

    <header>
        <h1>📦 Produktų Valdymas</h1>
        <p>Pridėkite ir tvarkykite savo produktų biblioteką</p>
    </header>

    <nav>
        <a href="../index.html" class="nav-btn">🏠 Pradžia</a>
        <a href="dashboard.html" class="nav-btn">📊 Dashboard</a>
        <a href="products.html" class="nav-btn">📦 Produktai</a>
        <a href="clients.html" class="nav-btn">👥 Klientai</a>
        <a href="invoices.html" class="nav-btn">📋 Sąskaitos</a>
        <a href="create-invoice.html" class="nav-btn">➕ Nauja Sąskaita</a>
        <!-- LOGOUT -->
        <div class="user-info">
            <span class="user-name"></span>
            <button id="logout-btn" style="margin-left: 10px; cursor: pointer;">
                Atsijungti
            </button>
        </div>
    </nav>

    <main>
        <h2>Produktų Sąrašas</h2>

        <div id="products-list">
            <p>Kraunama...</p>
        </div>

        <hr style="margin: 40px 0; border: none; border-top: 2px solid #8B7355;">

        <h2>Pridėti Naują Produktą</h2>

        <div class="form-container">
            <form id="product-form">
                <div class="form-group">
                    <label for="name">Produkto pavadinimas *</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="description">Aprašymas</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Kaina (EUR) *</label>
                    <input type="number" id="price" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="unit">Vienetas</label>
                    <select id="unit">
                        <option value="vnt">vnt (vienetai)</option>
                        <option value="kg">kg (kilogramai)</option>
                        <option value="m">m (metrai)</option>
                        <option value="m²">m² (kvadratiniai metrai)</option>
                        <option value="m³">m³ (kubiniai metrai)</option>
                        <option value="val">val (valandos)</option>
                        <option value="kompl">kompl (komplektai)</option>
                    </select>
                </div>

                <button type="submit" class="btn">Pridėti Produktą</button>
                <button type="button" class="btn" id="cancel-edit" style="display: none; background: #999;">Atšaukti
                    Redagavimą</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Edgar's Invoice System</p>
    </footer>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
<!-- AUTHENTICATION CHECK -->

    <script>
// PROTECT THIS PAGE - require authentication
(async function() {
    const isAuth = await AuthService.requireAuth();
    if (isAuth) {
        // Update UI with user info
        AuthService.updateUserUI();
        
        // Setup logout button
        AuthService.setupLogoutButton('#logout-btn');
    }
})();
</script>
    <script src="../js/products.js"></script>
    <script src="..js/themes.js"></script>
    <script src="../js/dark-mode.js"></script>
    
        
</body>

</html>
