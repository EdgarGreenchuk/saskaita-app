<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klientų Valdymas</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
    <button class="dark-mode-toggle" id="dark-mode-toggle">🌙</button>
    
    <header>
        <h1>👥 Klientų Valdymas</h1>
        <p>Tvarkykite savo klientų duomenis</p>
    </header>

   <nav>
    <a href="../index.html" class="nav-btn">🏠 Pradžia</a>
    <a href="dashboard.html" class="nav-btn">📊 Dashboard</a>
    <a href="products.html" class="nav-btn">📦 Produktai</a>
    <a href="clients.html" class="nav-btn">👥 Klientai</a>
    <a href="invoices.html" class="nav-btn">📋 Sąskaitos</a>
    <a href="create-invoice.html" class="nav-btn">➕ Nauja Sąskaita</a>
    <!-- LOGOUT -->
        <div class="user-info">
            <span class="user-name"></span>
            <button id="logout-btn" style="margin-left: 10px; cursor: pointer;">
                Atsijungti
            </button>
        </div>
</nav>

    <main>
        <h2>Klientų Sąrašas</h2>
        
        <div id="clients-list">
            <p>Kraunama...</p>
        </div>

        <hr style="margin: 40px 0; border: none; border-top: 2px solid #8B7355;">

        <h2>Pridėti Naują Klientą</h2>
        
        <div class="form-container">
            <form id="client-form">
                <div class="form-group">
                    <label for="company_name">Įmonės pavadinimas *</label>
                    <input type="text" id="company_name" required>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="company_code">Įmonės kodas</label>
                        <input type="text" id="company_code" placeholder="Pvz: 111950549">
                        <small style="color: #666; font-size: 0.85em; display: block; margin-top: 5px;">
                            💡 Patikrinti galite čia: <a href="https://www.registrucentras.lt/jar/p/" target="_blank" style="color: #C9941A;">registrucentras.lt</a>
                        </small>
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="vat_code">PVM kodas</label>
                        <input type="text" id="vat_code" placeholder="LT123456789">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Adresas</label>
                    <input type="text" id="address">
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 2;">
                        <label for="city">Miestas</label>
                        <input type="text" id="city">
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="postal_code">Pašto kodas</label>
                        <input type="text" id="postal_code">
                    </div>
                </div>

                <div class="form-group">
                    <label for="country">Šalis</label>
                    <input type="text" id="country" value="Lietuva">
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="email">El. paštas</label>
                        <input type="email" id="email">
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="phone">Telefonas</label>
                        <input type="tel" id="phone" placeholder="+370...">
                    </div>
                </div>

                <button type="submit" class="btn">Pridėti Klientą</button>
                <button type="button" class="btn" id="cancel-edit" style="display: none; background: #999;">Atšaukti Redagavimą</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Edgar's Invoice System</p>
    </footer>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
<!-- AUTHENTICATION CHECK -->

    <script>
// PROTECT THIS PAGE - require authentication
(async function() {
    const isAuth = await AuthService.requireAuth();
    if (isAuth) {
        // Update UI with user info
        AuthService.updateUserUI();
        
        // Setup logout button
        AuthService.setupLogoutButton('#logout-btn');
    }
})();
</script>
    <script src="../js/clients.js"></script>
    <script src="..js/themes.js"></script>
    <script src="../js/dark-mode.js"></script>
    
        
</body>
</html>
